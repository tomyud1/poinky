<div class="slide"><h1>Lecture 4 — Newton's second law</h1>
<div class="f"><i>F</i><sub>net</sub> = <i>m a</i> &nbsp;&nbsp;&nbsp; <i>a</i> = <i>F</i><sub>net</sub> / <i>m</i></div>
<ul><li>A 2 kg cart is pulled with 10 N to the right; friction is 4 N to the left.</li>
<li>Net force: 10 N − 4 N = 6 N, so a = 6 N / 2 kg = 3 m/s²</li>
<li>Free-body diagram:</li></ul>
<svg width="560" height="230" style="margin-left:1.2in"><rect x="200" y="80" width="140" height="80" fill="#cfe0f5" stroke="#1b3b6f" stroke-width="3"/><text x="245" y="128" font-size="22">2 kg</text>
<line x1="340" y1="120" x2="500" y2="120" stroke="#c22" stroke-width="5" marker-end="url(#a)"/><text x="420" y="105" font-size="20" fill="#c22">10 N</text>
<line x1="200" y1="120" x2="90" y2="120" stroke="#282" stroke-width="5" marker-end="url(#a)"/><text x="100" y="105" font-size="20" fill="#282">4 N</text>
<line x1="270" y1="160" x2="270" y2="220" stroke="#555" stroke-width="4" marker-end="url(#a)"/><text x="280" y="215" font-size="18">mg</text>
<line x1="270" y1="80" x2="270" y2="20" stroke="#555" stroke-width="4" marker-end="url(#a)"/><text x="280" y="30" font-size="18">N</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker></defs></svg>
</div></body></html>
