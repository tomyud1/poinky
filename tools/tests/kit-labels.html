<!doctype html><html><head><meta charset="utf-8">
<!-- 3D labels: part names stay through later steps, temp notes fade when the next step runs, clearLabels fades the rest. -->
<link rel="stylesheet" href="../../web/kit.css"></head><body>
<div id="stage"></div><svg id="lines"></svg><div id="tags"></div><div id="err"></div>
<script src="../../vendor/three.min.js"></script>
<script src="../../web/kit.js"></script>
<script>
(async () => {
  const results = [], fail = [];
  const check = (ok, what) => { results.push((ok ? 'ok   ' : 'FAIL ') + what); if (!ok) fail.push(what); };
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const tags = () => [...document.querySelectorAll('#tags .tag')].map(t => t.textContent);
  const shown = text => [...document.querySelectorAll('#tags .tag')].some(t => t.textContent === text && +t.style.opacity === 1);
  try {
    const kit = Kit(); kit.start(); window.kit = kit;
    kit.run(`const piston = kit.box({size:[1,1,1], name:'piston'}); kit.label('Piston', {to: piston});`);
    kit.run(`kit.label('Air rushes in', {at:[0,1,0], temp:true}); kit.label('Valve', {at:[1,1,0], color:'green'});`);
    await wait(1600);
    check(shown('Piston') && shown('Valve') && shown('Air rushes in'), `both kinds show (${tags()})`);
    const temp = [...document.querySelectorAll('#tags .tag')].find(t => t.textContent === 'Air rushes in');
    check(temp.classList.contains('temp'), 'a temp note looks different');

    kit.run(`kit.label('Spark!', {at:[0,2,0], temp:true, color:'orange'});`);   // the next sentence
    await wait(100);
    check(!shown('Air rushes in'), 'the last moment\'s note starts fading when the next step runs');
    await wait(1500);
    check(!tags().includes('Air rushes in'), `and then it's gone (${tags()})`);
    check(shown('Piston') && shown('Valve') && shown('Spark!'), `part names stay through later steps (${tags()})`);

    kit.clearLabels('temp'); kit.clearLabels('temp');   // twice: must not remove anything else
    await wait(600);
    check(tags().join() === 'Piston,Valve', `clearLabels('temp') leaves part names (${tags()})`);
    kit.clearLabels();
    await wait(600);
    check(!tags().length, 'clearLabels() fades them all');
  } catch (e) { check(false, 'threw: ' + (e && e.stack || e)); }
  document.body.textContent = results.join('\n');
  document.title = fail.length ? 'FAIL' : 'PASS';
  window.testResults = { pass: !fail.length, lines: results };
})();
</script></body></html>
