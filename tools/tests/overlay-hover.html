<!doctype html><html><head><meta charset="utf-8">
<!-- Every control the overlay draws lights up under the cursor and sinks when pressed (the shared hover module in
     web/overlay.html: SBX.pointAt from the cursor the app sends, since the overlay is never the key window), and each
     sits inside a rect the page reports, so the app lets the click through to it. Also: a photo card shows the whole
     picture (wide, tall, square), stays on the screen, and its caption wraps.
     `node tools/tests/run-web-tests.mjs overlay-hover`. The same controls in the real app: `Poinky --hover-shot <dir>`. -->
<style>html,body{margin:0;height:100%;background:#e9e7e2}iframe{position:absolute;inset:0;width:1400px;height:900px;border:0}</style>
</head><body>
<iframe id="ov" src="../../web/overlay.html"></iframe>
<script>
(async () => {
  const results = [], fail = [];
  const check = (ok, what) => { results.push((ok ? 'ok   ' : 'FAIL ') + what); if (!ok) fail.push(what); };
  const wait = ms => new Promise(r => setTimeout(r, ms));
  // A picture of a given shape, as a data URL (with a frame so a crop would show).
  const picture = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
    g.fillStyle = '#9cc'; g.fillRect(0, 0, w, h); g.strokeStyle = '#c00'; g.lineWidth = 8; g.strokeRect(4, 4, w - 8, h - 8); return c.toDataURL(); };
  try {
    const F = document.getElementById('ov'), W = F.contentWindow;
    for (let i = 0; i < 100 && !(W.SB && W.SB.lessonBegin && W.SB.helperSpawn && W.SBX); i++) await wait(50);
    const SB = W.SB, X = W.SBX, D = W.document;
    let posts = [];
    W.webkit = { messageHandlers: { sb: { postMessage: m => posts.push(JSON.parse(JSON.stringify(m))) } } };
    const lastOf = kind => [...posts].reverse().find(m => m.kind === kind);
    const center = el => { const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; };
    const inRects = (p, rects) => (rects || []).some(r => p.x >= r[0] - 2 && p.x <= r[0] + r[2] + 2 && p.y >= r[1] - 2 && p.y <= r[1] + r[3] + 2);
    const reachable = p => inRects(p, (lastOf('scene') || {}).rects) || inRects(p, (lastOf('helperRects') || {}).rects) ||
      (lastOf('bubble') && lastOf('bubble').rect && inRects(p, [lastOf('bubble').rect]));
    const look = el => { const s = W.getComputedStyle(el); return [s.backgroundColor, s.boxShadow, s.color, s.filter, s.cursor].join('|'); };
    const settle = () => wait(220);   // the hover transition (.14 s)

    // Everything on screen at once: a paper with a drawn step, a panel card, a 3D model card with notes, a photo,
    // the Clear pill, a helper with its card open, and the bubble with Copy / ✕.
    SB.buddyOn(true); SB.phase('ready');
    SB.lessonBegin({ x: 60, y: 60, w: 520, h: 360, h0: 300, lo: 60, hi: 600 }, 'Fractions', false);
    SB.lessonStep({ ops: [{ op: 'text', x: 40, y: 60, text: 'Half of a pizza', size: 30 }] }, 1);
    SB.lessonStep({ ops: [{ op: 'box', x: 40, y: 110, w: 200, h: 80 }] }, 1);
    SB.apply({ items: [{ type: 'panel', id: 'p1', x: 640, y: 60, w: 300, h: 220, html: '<h1>Panel</h1>' },
                      { type: 'scene3d', id: 'm1', x: 640, y: 320, w: 420, h: 320, code: '' }] }, 1);
    await wait(500);
    SB.run3d('m1', '', 'Spin the wheel'); SB.run3d('m1', '', 'Look inside');
    SB.helperSpawn(1, 'Mint', 'Fix the failing test', 0, 'Fix the failing test in parser.py', '~/code/app');
    for (let i = 0; i < 40 && SB.lessonBusy(); i++) await wait(100);
    await wait(2500);   // the helper flies to the edge

    // ---------- each control: lit by the cursor, reachable ----------
    const paper = D.querySelector('.card.lpaper');
    const controls = [
      ['paper Save', () => paper.querySelector('.save:not(.all)')],
      ['paper ✕', () => paper.querySelector('.bar .x')],
      ['paper bar (drag)', () => paper.querySelector('.bar'), el => { const r = el.getBoundingClientRect(); return { x: r.left + 20, y: r.top + 19 }; }],
      ['a past step', () => paper.querySelector('.lsvg > g[data-step="1"]'), el => { const r = el.getBoundingClientRect(); return { x: r.left + 20, y: r.top + r.height / 2 }; }],
      ['panel ✕', () => D.querySelector('.card[data-id="p1"] .x')],
      ['3D card ✕', () => D.querySelector('.card[data-id="m1"] .x')],
      ['a 3D step note', () => D.querySelector('.card[data-id="m1"] .notes li')],
      ['Clear pill', () => D.getElementById('clearBtn')],
    ];
    const tryControl = async (name, get, at) => {
      const el = get();
      if (!el) { check(false, `${name}: on screen`); return; }
      X.pointAt(null); await settle();
      const before = look(el);
      const p = at ? at(el) : center(el);
      X.pointAt(p); await settle();
      const lit = X.hotEl() === el && el.classList.contains('hot');
      const changed = el.matches('g[data-step]') ? !!D.querySelector('rect.stephi') : look(el) !== before;   // a step: a box behind it
      check(lit && changed, `${name}: lights up under the cursor (${X.hotName() || 'nothing'})`);
      check(reachable(p), `${name}: inside a rect the app lets clicks through`);
      // Pressed: a real mouse down on it.
      el.dispatchEvent(new W.MouseEvent('mousedown', { bubbles: true, clientX: p.x, clientY: p.y }));
      const pressed = el.classList.contains('down');
      W.dispatchEvent(new W.MouseEvent('mouseup', { bubbles: true, clientX: p.x, clientY: p.y }));
      check(pressed && !el.classList.contains('down'), `${name}: pressed while the button is down, not after`);
      X.pointAt({ x: 5, y: 890 }); await wait(30);
      check(!el.classList.contains('hot') && !D.querySelector('rect.stephi'), `${name}: goes back when the cursor leaves`);
    };
    for (const [n, g, a] of controls) await tryControl(n, g, a);

    // While a step is being drawn, past steps don't light up (a click wouldn't replay them).
    SB.lessonStep({ ops: [{ op: 'text', x: 40, y: 240, text: 'is the same as two quarters, drawn slowly', size: 30 }] }, 1);
    await wait(80);
    const st = paper.querySelector('.lsvg > g[data-step="1"]'), r1 = st.getBoundingClientRect();
    X.pointAt({ x: r1.left + 20, y: r1.top + r1.height / 2 });
    check(SB.lessonBusy() && X.hotEl() !== st, `a past step doesn't light up while the next one draws (${X.hotName() || 'nothing'})`);
    for (let i = 0; i < 80 && SB.lessonBusy(); i++) await wait(100);
    X.pointAt(null);

    // The helper's card opens when you rest on it; its buttons light up.
    const chip = () => D.querySelector('.hl-chip');
    if (chip()) {
      const hp = SB.helperPos('1'), c = { x: hp.x + 6, y: hp.y + 6 };   // resting on the helper itself opens its card
      for (let i = 0; i < 12; i++) { SB.tick(c.x, c.y, 0); await wait(100); }
      const stop = chip().querySelector('.btns:not(.ask) button.stop');
      await wait(400);
      if (stop && stop.getBoundingClientRect().height > 0) {
        const p = center(stop);
        for (let i = 0; i < 4; i++) { SB.tick(p.x, p.y, 0); await wait(80); }
        const at = D.elementFromPoint(p.x, p.y);
        check(X.hotEl() === stop, `helper card Stop: lights up under the app's cursor (${X.hotName() || 'nothing'}; at ${Math.round(p.x)},${Math.round(p.y)} is ${at && at.tagName}.${at && at.className})`);
        check(reachable(p), 'helper card Stop: inside a rect the app lets clicks through');
      } else check(false, 'helper card opens when the cursor rests on the helper');
      SB.tick(5, 890, 0); await wait(600);
    } else check(false, 'helper on screen');

    // The bubble: Copy and ✕ once a read answer is done.
    SB.tick(300, 700, 0); SB.captionMode('read'); SB.phase('speaking'); SB.caption('claude', 'Half is the same as two quarters.');
    await wait(300); SB.phase('ready'); SB.captionDone('Half is the same as two quarters.', true); await wait(500);
    const copy = D.querySelector('#bubble .foot button.copy') || D.querySelector('#bubble .foot button');
    if (copy) {
      const p = center(copy);
      for (let i = 0; i < 4; i++) { SB.tick(p.x, p.y, 0); await wait(80); }
      check(X.hotEl() === copy && copy.classList.contains('hot'), `bubble Copy: lights up under the app's cursor (${X.hotName() || 'nothing'})`);
      check(reachable(p), 'bubble Copy: inside a rect the app lets clicks through');
    } else check(false, 'bubble shows Copy');

    // ---------- photos: the whole picture, on screen, caption wraps ----------
    SB.clearAll();
    for (const [w, h, name] of [[1200, 400, 'wide'], [400, 1200, 'tall'], [800, 600, '4:3'], [600, 600, 'square']]) {
      SB.photo({ src: picture(w, h), caption: name === 'wide' ? 'Properties of water: bond angle and length' : name });
      await wait(400);
      const c = [...D.querySelectorAll('.card.photo')].pop(), img = c.querySelector('img');
      const shown = img.offsetWidth / img.offsetHeight, want = w / h;   // (its layout box: the card is tilted)
      check(Math.abs(shown - want) / want < 0.03, `photo ${name}: the box has the picture's shape (${shown.toFixed(2)} vs ${want.toFixed(2)}), so nothing is cut off`);
      check(W.getComputedStyle(img).objectFit === 'contain', `photo ${name}: fit, never cover`);
      const cr = c.getBoundingClientRect();
      check(cr.left >= 0 && cr.top >= 0 && cr.right <= W.innerWidth && cr.bottom <= W.innerHeight && cr.height <= W.innerHeight * 0.6,
        `photo ${name}: on the screen and not too tall (${Math.round(cr.width)}×${Math.round(cr.height)})`);
      const cap = c.querySelector('.pcap');
      check(cap.scrollHeight <= cap.clientHeight + 2, `photo ${name}: the caption fits (wraps, no cut-off)`);
      const x = c.querySelector('.x');
      { const q = center(x); SB.tick(q.x, q.y, 0); } await settle();
      check(X.hotEl() === x, `photo ${name}: its ✕ lights up (${X.hotName() || 'nothing'})`);
      check(reachable(center(x)), `photo ${name}: its ✕ takes clicks`);
      SB.tick(5, 890, 0);
      SB.clearAll();
    }
    // A lesson's photo goes beside the open paper, not over it.
    SB.lessonBegin({ x: 60, y: 60, w: 520, h: 360, h0: 300, lo: 60, hi: 600 }, 'Water', false);
    await wait(300);
    SB.photo({ src: picture(800, 600), caption: 'Water' }); await wait(400);
    const pp = D.querySelector('.card.lpaper').getBoundingClientRect(), ph = D.querySelector('.card.photo').getBoundingClientRect();
    check(ph.left >= pp.right || ph.right <= pp.left, `a lesson's photo sits beside the paper (paper ${Math.round(pp.left)}–${Math.round(pp.right)}, photo ${Math.round(ph.left)}–${Math.round(ph.right)})`);

    // ---------- the speech bubble keeps off the marks and what the answer is about ----------
    SB.clearAll(); SB.captionMode('speech'); SB.phase('speaking');
    const meet = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
    SB.tick(600, 400, 0); await wait(900);
    // A circle right where the bubble would go (below right of the buddy), as the talker draws one.
    SB.apply({ items: [{ type: 'circle', id: 'c1', x: 720, y: 470, r: 40 }] }, 1); await wait(250);
    SB.caption('claude', 'This bar is the tallest one, so Billing closed the most tickets.'); await wait(700);
    const g = D.querySelector('#draw > g[data-id="c1"]').getBoundingClientRect(), bb = SB.bubbleBox();
    check(bb.on && !meet(bb, { x: g.left, y: g.top, w: g.width, h: g.height }), `the bubble keeps off a mark beside the buddy (bubble ${Math.round(bb.x)},${Math.round(bb.y)} ${Math.round(bb.w)}×${Math.round(bb.h)})`);
    // What the answer is about (the app's subjects): kept clear too.
    SB.clearAll(); SB.bubbleAvoid([[560, 300, 560, 90]]); SB.tick(600, 420, 0); await wait(700);
    SB.caption('claude', 'The top bar is the Billing team.'); await wait(600);
    const b2 = SB.bubbleBox();
    check(b2.on && !meet(b2, { x: 560, y: 300, w: 560, h: 90 }), `the bubble keeps off what the answer is about (bubble ${Math.round(b2.x)},${Math.round(b2.y)})`);
    SB.bubbleAvoid([]);
  } catch (e) { check(false, 'threw: ' + e.message); }
  window.testResults = { pass: fail.length === 0, lines: results };
  document.title = fail.length ? 'FAIL' : 'PASS';
})();
</script></body></html>
