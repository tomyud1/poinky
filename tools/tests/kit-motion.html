<!doctype html><html><head><meta charset="utf-8">
<!-- Reduce Motion: the camera doesn't swoop in, sway or turntable, camera moves are short, parts appear without
     the drop-and-bounce; what the model does (a spinning fan) still moves. -->
<link rel="stylesheet" href="../../web/kit.css"></head><body style="width:800px;height:600px">
<div id="stage"></div><svg id="lines"></svg><div id="tags"></div><div id="err"></div>
<script src="../../vendor/three.min.js"></script>
<script src="../../web/kit.js"></script>
<script>
(async () => {
  const results = [], fail = [];
  const check = (ok, what) => { results.push((ok ? 'ok   ' : 'FAIL ') + what); if (!ok) fail.push(what); };
  const wait = ms => new Promise(r => setTimeout(r, ms));
  try {
    const kit = Kit({ reduceMotion: true }); window.kit = kit;
    const azimuth = () => { const d = kit.camera.getWorldDirection(new THREE.Vector3()); return Math.atan2(-d.x, -d.z) * 180 / Math.PI; };
    const dist = () => kit.camera.position.distanceTo(new THREE.Vector3(0, 0.5, 0));
    kit.run(`kit.view({az:30, el:20}); kit.box({size:[3,1,1], at:[0,0.5,0], name:'body'});
             const fan = kit.rotor({kind:'fan', r:0.6, at:[1.8,0.5,0], name:'fan'}); kit.spin(fan, 'x', 6);`);
    kit.start();
    await wait(200);
    const d0 = dist();
    await wait(1200);
    const d1 = dist();
    check(Math.abs(d1 - d0) / d1 < 0.08, `no swoop in: the camera starts where it stays (${d0.toFixed(2)} → ${d1.toFixed(2)})`);
    const body = kit.get('body');
    check(Math.abs(body.scale.x - 1) < 1e-6 && Math.abs(body.position.y - 0.5) < 1e-6, 'parts are in place without a drop-in');
    const a0 = azimuth(); await wait(2500); const a1 = azimuth();
    check(Math.abs(a1 - a0) < 1, `no idle sway (${a0.toFixed(1)}° → ${a1.toFixed(1)}°)`);
    const fan = kit.get('fan'), r0 = fan.rotation.x; await wait(300);
    check(fan.rotation.x !== r0, 'a spinning part still spins (it is the explanation)');
    kit.run(`kit.view({az:120, el:20, dur:2.5})`);
    await wait(1100);
    const a2 = azimuth();
    check(Math.abs(a2 - 120) < 6, `a 2.5 s camera move is short (at ${a2.toFixed(0)}° after 1.1 s)`);
    kit.run(`kit.view({az:200, el:20, spin:true})`);
    await wait(1500);
    const a3 = azimuth(); await wait(1000); const a4 = azimuth();
    check(Math.abs(((a4 - a3 + 540) % 360) - 180) < 1, `no turntable spin (${a3.toFixed(0)}° → ${a4.toFixed(0)}°)`);
  } catch (e) { check(false, 'threw: ' + (e && e.stack || e)); }
  document.body.textContent = results.join('\n');
  document.title = fail.length ? 'FAIL' : 'PASS';
  window.testResults = { pass: !fail.length, lines: results };
})();
</script></body></html>
