<!doctype html><html><head><meta charset="utf-8">
<!-- A still model stops redrawing (battery): after the sway settles nothing is drawn until something changes;
     new code, a spinning part or a camera move draw again. -->
<link rel="stylesheet" href="../../web/kit.css"></head><body style="width:640px;height:480px">
<div id="stage"></div><svg id="lines"></svg><div id="tags"></div><div id="err"></div>
<script src="../../vendor/three.min.js"></script>
<script src="../../web/kit.js"></script>
<script>
(async () => {
  const results = [], fail = [];
  const check = (ok, what) => { results.push((ok ? 'ok   ' : 'FAIL ') + what); if (!ok) fail.push(what); };
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const drawnIn = async ms => { const r0 = kit.renders(); await wait(ms); return kit.renders() - r0; };
  try {
    const kit = Kit({ swayFor: 0.5 }); window.kit = kit;   // the sway settles after 0.5 s of quiet (20 s in the app)
    kit.run(`kit.box({size:[2,1,1], color:'blue', name:'body'}); kit.label('Body', {to: kit.get('body')});`);
    kit.start();
    const busy = await drawnIn(1000);
    check(busy > 10, `it draws while it settles (${busy} frames in 1 s)`);
    await wait(6500);   // sway fades out 5 s after the last interaction + 0.5 s + 3 s fade
    const idle = await drawnIn(1500);
    check(idle <= 1, `a still model stops drawing (${idle} frames in 1.5 s)`);
    check(+document.querySelector('#tags .tag').style.opacity === 1, 'its label is still showing');
    kit.run(`kit.box({size:[0.5,0.5,0.5], at:[0,1,0], color:'red', name:'cap'})`);
    const woke = await drawnIn(800);
    check(woke > 5, `new code draws again (${woke} frames)`);
    kit.run(`kit.spin(kit.get('cap'), 'y', 3)`);
    await wait(5000);
    const spin = await drawnIn(1000);
    check(spin > 10, `a spinning part keeps drawing (${spin} frames in 1 s)`);
  } catch (e) { check(false, 'threw: ' + (e && e.stack || e)); }
  document.body.textContent = results.join('\n');
  document.title = fail.length ? 'FAIL' : 'PASS';
  window.testResults = { pass: !fail.length, lines: results };
})();
</script></body></html>
