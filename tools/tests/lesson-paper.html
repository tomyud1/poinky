<!doctype html><html><head><meta charset="utf-8">
<!-- The paper lessons (web/lesson.js) through the real overlay: math is laid out (fractions, powers, roots,
     a JSON "\frac" that arrived as a form feed), graphs plot only safe math, labels stay off their arrows
     and curves, chemical formulas get subscripts, nothing runs off the paper or lands on something else. -->
<style>html,body{margin:0;height:100%;background:#fff}iframe{position:absolute;inset:0;width:1400px;height:900px;border:0}</style>
</head><body>
<iframe id="ov" src="../../web/overlay.html"></iframe>
<script>
(async () => {
  const results = [], fail = [];
  const check = (ok, what) => { results.push((ok ? 'ok   ' : 'FAIL ') + what); if (!ok) fail.push(what); };
  const wait = ms => new Promise(r => setTimeout(r, ms));
  try {
    const W = document.getElementById('ov').contentWindow;
    for (let i = 0; i < 100 && !(W.SB && W.SB.lessonBegin); i++) await wait(50);
    const SB = W.SB, T = SB._lessonTest;
    const done = async () => { for (let i = 0; i < 400 && SB.lessonBusy(); i++) await wait(50); await wait(80); };
    const item = id => T.items[id];
    const bbox = id => item(id).getBBox();
    const hit = (a, b) => a.x < b.x + b.width && b.x < a.x + a.width && a.y < b.y + b.height && b.y < a.y + a.height;

    // Safe function parser.
    const f = (s, x) => T.compileFn(s)(x);
    check(f('x^2', 3) === 9 && f('2x+1', 2) === 5 && Math.abs(f('sin(pi/2)', 0) - 1) < 1e-9 && f('3(x+1)^2', 1) === 12, 'functions of x evaluate (x^2, 2x+1, sin(pi/2), 3(x+1)^2)');
    check(Math.abs(f('e^x', 1) - Math.E) < 1e-9 && f('-x^2', 2) === -4 && f('sqrt(x)/2', 16) === 2, 'e^x, -x^2 is -(x^2), sqrt(x)/2');
    let threw = false; try { T.compileFn('alert(1)')(0); } catch (e) { threw = true; }
    check(threw, 'anything that is not math is refused (no code runs)');

    SB.lessonBegin({ x: 700, y: 60, w: 640, h: 800 }, 'test');
    SB.lessonStep({ ops: [
      { op: 'text', id: 'h', x: 40, y: 60, text: 'Chain rule', size: 34, bold: true },
      { op: 'math', id: 'fr', x: 40, y: 150, text: '\f' + 'rac{dy}{dx} = 5u^4', size: 30 },   // what "\frac" in JSON becomes
      { op: 'math', id: 'pw', x: 400, y: 150, text: 'x^10 + e^(2x) - \\sqrt{x}', size: 30 },
      { op: 'text', id: 'ch', x: 40, y: 230, text: 'Water is H2O, not a PS5', size: 24 },
      { op: 'text', id: 'dup', x: 40, y: 230, text: 'drawn on the same spot', size: 24 },
      { op: 'text', id: 'wide', x: 40, y: 330, text: 'A very long line of handwriting that would never fit across the paper at this size', size: 30 },
    ] }, 1);
    await done();
    const fr = item('fr');
    check(fr.querySelectorAll('path').length >= 1 && [...fr.querySelectorAll('text')].map(t => t.textContent).join('|').includes('dy'), 'a \\frac that arrived as a form feed is still a fraction');
    const texts = [...fr.querySelectorAll('text')], dy = texts.find(t => t.textContent === 'dy'), dx = texts.find(t => t.textContent === 'dx');
    const bar = fr.querySelector('path').getBBox(), mid = b => b.y + b.height / 2;
    check(dy && dx && mid(dy.getBBox()) < bar.y && mid(dx.getBBox()) > bar.y + bar.height, 'the numerator sits above the bar, the denominator below');
    const pw = [...item('pw').querySelectorAll('text')].map(t => t.textContent);
    check(pw.includes('10') && pw.includes('2x'), `unbraced powers take the whole number and e^(2x) its parentheses (${pw.join('|')})`);
    check(pw.some(t => t.includes('−')), 'math uses a real minus sign');
    check(item('pw').querySelector('path') != null, 'a square root draws its sign');
    const ch = item('ch').querySelector('text'), spans = [...ch.querySelectorAll('tspan')];
    check(spans.some(s => s.textContent === '2' && +s.getAttribute('font-size') < 24) && !spans.some(s => s.textContent === '5' && s.getAttribute('font-size')), 'H2O gets a small 2, "PS5" stays as it is');
    check(!hit(bbox('ch'), bbox('dup')), 'text drawn on the same spot moves below instead of on top');
    const wb = bbox('wide');
    check(wb.x + wb.width <= 800, `a line too long for the paper shrinks to fit (right edge ${Math.round(wb.x + wb.width)})`);

    SB.lessonStep({ ops: [
      { op: 'graph', id: 'g', x: 80, y: 420, w: 320, h: 220, xrange: [-1, 3], yrange: [-1, 9], xlabel: 'x', ylabel: 'y' },
      { op: 'plot', id: 'p', graph: 'g', fn: 'x^2', color: 'blue' },
      { op: 'plot', id: 'bad', graph: 'g', fn: 'fetch("x")', color: 'red' },
      { op: 'point', id: 'pt', graph: 'g', at: [2, 4], label: '(2, 4)' },
      { op: 'arrow', id: 'a', from: [480, 450], to: [740, 450], label: 'gets steeper' },
    ] }, 1);
    await done();
    const gb = bbox('g'), pb = bbox('p');
    check(pb.width > 100 && pb.x >= gb.x - 2 && pb.x + pb.width <= gb.x + gb.width + 2 && pb.y >= gb.y - 2, 'the curve is drawn inside its graph');
    check(!item('bad') || !item('bad').querySelector('path'), 'a plot that is not math draws nothing');
    // The dot is at (2,4): x = 80 + 3/4*320 = 320, y = 420 + 220 - 5/10*220 = 530.
    const dot = item('pt').querySelector('path').getBBox();
    check(Math.abs(dot.x + dot.width / 2 - 320) < 3 && Math.abs(dot.y + dot.height / 2 - 530) < 3, 'a point lands at its coordinates');
    const lab = item('pt').querySelector('text').getBBox();
    const p = item('p').querySelector('path'), L = p.getTotalLength();
    let onCurve = 0;
    for (let k = 0; k <= 60; k++) { const q = p.getPointAtLength(L * k / 60); if (q.x > lab.x && q.x < lab.x + lab.width && q.y > lab.y && q.y < lab.y + lab.height) onCurve++; }
    check(onCurve === 0, `the point's label doesn't sit on the curve (${onCurve} curve points under it)`);
    const al = item('a').querySelector('text').getBBox();
    check(al.y + al.height < 450 || al.y > 450, `an arrow's label sits beside the arrow, not on it (label ${Math.round(al.y)}–${Math.round(al.y + al.height)}, arrow at 450)`);

    // Save: the page becomes a picture for the app to keep.
    const msgs = [];
    W.webkit = { messageHandlers: { sb: { postMessage: m => msgs.push(m) } } };
    const paperEl = W.document.querySelector('.card.lpaper');
    paperEl.querySelector('.save').click();
    for (let i = 0; i < 100 && !msgs.some(m => m.kind === 'saveLesson'); i++) await wait(50);
    const saved = msgs.find(m => m.kind === 'saveLesson');
    check(saved && /^data:image\/png;base64,/.test(saved.png || '') && saved.title === 'test', 'Save sends a PNG of the page with its title');
    if (saved && saved.png) {
      const img = new Image(); img.src = saved.png; await img.decode();
      check(img.width === 1600 && img.height > 1200, `the picture is sharp (2×) and holds everything drawn (${img.width}×${img.height})`);
    }
    SB.lessonSaved('Desktop', true);
    check(/Desktop/.test(paperEl.querySelector('.save').textContent), 'the button says where it went');
  } catch (e) { check(false, 'threw: ' + e.message); }
  window.testResults = { pass: !fail.length, lines: results };
})();
</script>
</body></html>
