name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Check the scripts
        run: |
          for f in install.sh build.sh phonon/install.sh tools/test-helpers.sh; do bash -n "$f"; done
          python3 -m py_compile phonon/phonon_server.py tools/fake-helper.py
          node --check web/lesson.js
          node --check web/buddy.js
          node --check web/kit.js
          node --check web/helpers.js
          node --check web/sounds.js
          node --check web/helpers-app.js

      - name: Build the app
        env:
          POINKY_ADHOC: "1"   # no screen to click "Always Allow" on, so skip the local certificate
        run: ./build.sh
        timeout-minutes: 15

      - name: Check the app bundle
        run: |
          APP=build/Poinky.app
          codesign --verify --verbose "$APP"
          for f in Contents/MacOS/Poinky Contents/Info.plist Contents/Resources/web/libs.js Contents/Resources/web/helpers.js Contents/Resources/web/helpers-app.js Contents/Resources/web/sounds.js \
                   Contents/Resources/talker-prompt.md Contents/Resources/phonon_server.py \
                   Contents/Resources/phonon/install.sh Contents/Resources/phonon/phonon_server.py; do
            test -s "$APP/$f" || { echo "missing from the app: $f"; exit 1; }
          done

      - name: Test helpers (parser, waiting line, follow-ups, stop; no tokens)
        run: tools/test-helpers.sh
        timeout-minutes: 10

      - name: Check the installer's help and its guards
        run: |
          bash install.sh --help
          ! bash install.sh --nonsense
