name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Check the scripts
        run: |
          for f in install.sh build.sh phonon/install.sh stt/install.sh tools/stt-test/check.sh tools/test-helpers.sh tools/test-voice.sh tools/test-talker.sh tools/test-update.sh tools/test-reminders.sh tools/test-screens.sh tools/test-launches.sh; do bash -n "$f"; done
          python3 -m py_compile phonon/phonon_server.py tools/fake-helper.py tools/fake-claude.py tools/test-call-loop.py tools/eval-talker/run.py tools/eval-talker/scenarios.py
          node --check web/lesson.js
          node --check web/buddy.js
          node --check web/kit.js
          node --check web/helpers.js
          node --check web/sounds.js
          node --check web/helpers-app.js

      - name: Build the app
        env:
          POINKY_ADHOC: "1"   # no screen to click "Always Allow" on, so skip the local certificate
        run: ./build.sh
        timeout-minutes: 15

      - name: Check the app bundle
        run: |
          APP=build/Poinky.app
          codesign --verify --verbose "$APP"
          for f in Contents/MacOS/Poinky Contents/Info.plist Contents/Resources/web/libs.js Contents/Resources/web/helpers.js Contents/Resources/web/helpers-app.js Contents/Resources/web/sounds.js \
                   Contents/Resources/talker-prompt.md Contents/Resources/phonon_server.py \
                   Contents/Resources/phonon/install.sh Contents/Resources/phonon/phonon_server.py; do
            test -s "$APP/$f" || { echo "missing from the app: $f"; exit 1; }
          done

      - name: Test what the voice hears (spoken-text normalizer, sentence splitting)
        run: tools/test-voice.sh
      - name: Speech logic (language pick, context words, levels)
        run: tools/stt-test/check.sh

      - name: Test when repeating reminders come due (DST, time zones, months off, clock set back)
        run: tools/test-reminders.sh

      - name: Test which display the overlay uses (made-up layouts) and how a last run ended (no app)
        run: tools/test-screens.sh && tools/test-launches.sh

      - name: Test the talker's replies (offers; the talker eval replayed from saved replies; no tokens)
        run: tools/test-talker.sh

      - name: Test in-app updates of a developer's checkout (scratch repos; no network)
        run: tools/test-update.sh

      - name: Test helpers (parser, waiting line, follow-ups, stop; no tokens)
        run: tools/test-helpers.sh
        timeout-minutes: 10

      - name: Check the installer's help and its guards
        run: |
          bash install.sh --help
          ! bash install.sh --nonsense
